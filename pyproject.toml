[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moodle-py"
version = "0.1.0"
description = "Moodle API client and local data utilities"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "dotenv>=0.9.9",
    "python-dotenv>=1.2.2",
]

[tool.setuptools.packages.find]
where = ["src"]
